[project]
name = "weightxfer"
version = "0.1.0"
description = "Robust skin weight transfer (closest-point matching + weight inpainting, Abdrashitov et al. 2023) on numpy, scipy and robust-laplacian"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "robust-laplacian>=1.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
weightxfer = "weightxfer.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["weightxfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
